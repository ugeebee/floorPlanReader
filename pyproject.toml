[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "floorplan_reader"
version = "0.1.0"
description = "Floor plan analysis model and tools using fine-tuned Qwen3-VL 8B."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "pillow>=10.0",
    "matplotlib>=3.7",
    "cairosvg>=2.7",
    "svglib>=1.5",
]

[project.optional-dependencies]
training = [
    "torch>=2.2.0",
    "transformers>=4.45.0",
    "peft>=0.11.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "trl>=0.9.0",
    "datasets>=2.19.0",
    "qwen-vl-utils>=0.0.8",
]
dev = [
    "pytest>=8.0",
]
